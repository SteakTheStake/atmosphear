name: Build and publish Godot game

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Cache verified Godot editor and Web templates
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/godot
            ~/.local/share/godot/export_templates/4.6.2.stable
          key: godot-4.6.2-linux-x86_64-web-sha512-v1
      - name: Install official Godot 4.6.2 with pinned SHA-512 checks
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: python3 tools/install_ci_godot.py --destination "$RUNNER_TEMP/godot"
      - name: Add Godot to PATH
        run: echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import, verify used audio, and export release game
        run: python3 tools/build_pages.py --godot godot
      - name: Install browser test tools
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify Pages subpath without server isolation headers
        run: node tests/pages_browser.cjs build/pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
